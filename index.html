        <div class="flex gap-2">
          <input class="inp flex-1" id="fbU" value="${esc(ui.firebaseUrl)}" placeholder="https://....firebasedatabase.app/data.json">
          <button class="btn btn-primary btn-sm flex-none" onclick="ui.firebaseUrl=normalizeFirebaseUrl(document.getElementById('fbU').value);localStorage.setItem(FIREBASE_URL_KEY,ui.firebaseUrl);pullFromFirebase(true);setupFirebaseRealtime();toast('URL сохранен')">${ic('check')} Подключить</button>
        </div>
      </div>

      <details style="margin-top:18px;border-top:1px solid var(--line);padding-top:10px">
        <summary class="flex justify-between items-center text-xs text-muted font-semibold" style="cursor:pointer;user-select:none;padding:4px 0;outline:none">
          <span>Файлы резервной копии (.json)</span>
          <span style="font-size:10px;opacity:.7">▾</span>
        </summary>
        <div class="flex gap-2 flex-wrap" style="padding:10px 0 4px">
          <button class="btn btn-soft btn-sm" onclick="exportBackup()">${ic('download')} Скачать файл бэкапа</button>
          <button class="btn btn-soft btn-sm" onclick="document.getElementById('bInp').click()">${ic('upload')} Загрузить из файла</button>
          <input type="file" id="bInp" accept=".json" style="display:none" onchange="importBackup(event)">
        </div>
      </details>

      <details style="margin-top:8px;border-top:1px solid var(--line);padding-top:10px">
        <summary class="flex justify-between items-center text-xs text-muted font-semibold" style="cursor:pointer;user-select:none;padding:4px 0;outline:none">
          <span>Сброс и очистка данных</span>
          <span style="font-size:10px;opacity:.7">▾</span>
        </summary>
        <div class="flex gap-2 flex-wrap" style="padding:10px 0 4px">
          <button class="btn btn-soft btn-sm" onclick="confirmAction('Сбросить до демо?','Заменить данные демо-набором «Пятницы»? Будет сохранен резервный файл.','Сбросить',()=>{ exportBackup(); db=normalizeAndMigrateDB(seedDatabase()); saveDatabase(); render(); toast('Демо-данные восстановлены'); })">Вернуть демо-данные</button>
          <button class="btn btn-ghost btn-sm text-must" onclick="confirmAction('Очистить всё?','Безвозвратно стереть все события, шаблоны и контакты? Будет сохранен резервный файл.','Очистить',()=>{ exportBackup(); db={schemaVersion:SCHEMA_VERSION,updatedAt:nowTs(),deletedIds:{},formats:[],events:[],bookings:[],clients:[]}; saveDatabase(); render(); toast('База очищена'); })">Полная очистка</button>
        </div>
      </details>
    </div>
  `);
}

function exportBackup() {
  const blob = new Blob([JSON.stringify(db, null, 2)], { type:'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `backup_pyatnitsa_${TODAY_ISO}.json`;
  a.click(); URL.revokeObjectURL(a.href); toast('Бэкап сохранен');
}

function importBackup(e) {
  const file = e.target.files?.[0]; if(!file) return;
  const r = new FileReader(); r.onload = () => {
    try {
      db = cleanupClientDuplicates(normalizeAndMigrateDB(JSON.parse(r.result)));
      saveDatabase(true); render(); toast('Данные успешно восстановлены');
    } catch(err){ toast('Ошибка чтения файла бэкапа'); }
  };
  r.readAsText(file);
}

function openNotificationsModal() {
  const warns = getActivePrompts();
  openModal(`
    <div class="modal-head flex items-start justify-between gap-3">
      <div class="flex items-center gap-2">
        <div class="text-rent">${ic('bell')}</div>
        <div>
          <div class="modal-title">Напоминания о событиях</div>
          <div class="modal-sub">${warns.length ? `Подошел срок (${warns.length}):` : 'Все события в графике'}</div>
        </div>
      </div>
      <button class="icon-btn sm" onclick="requestCloseModal()">${ic('x')}</button>
    </div>
    <div class="modal-body">
      ${!warns.length ? `<div class="text-center text-muted" style="padding:24px">Все регулярные события запланированы вовремя!</div>` : `
        <div class="list-card">
          ${warns.map(w => `
            <div class="row flex items-center justify-between gap-3">
              <div class="flex-1">
                <div class="font-bold text-base">${esc(w.format.title)}</div>
                <div class="text-sm text-muted" style="margin-top:2px">
                  <span class="tag" style="background:#FDEDE9;color:#DE6254">${w.daysSince === 999 ? 'Еще не проводилось' : `Пауза ${w.daysSince} дн.`}</span>
                  раз в ${w.target} дн.
                </div>
              </div>
              <div class="flex items-center gap-2 flex-none">
                <button class="btn btn-primary btn-sm" onclick="forceCloseModal(); openAddEventModal('${w.format.id}')">${ic('plus')} В график</button>
                <button class="icon-btn sm" onclick="snoozePrompt('${w.format.id}'); openNotificationsModal(); toast('Отложено на неделю')">${ic('x')}</button>
              </div>
            </div>
          `).join('')}
        </div>
      `}
    </div>
    <div class="modal-foot flex gap-2 justify-end">
      ${warns.length > 1 ? `<button class="btn btn-ghost btn-sm" onclick="getActivePrompts().forEach(w=>snoozePrompt(w.format.id)); forceCloseModal(); toast('Все напоминания отложены')">Отложить все</button>` : ''}
      <button class="btn btn-soft btn-sm" onclick="requestCloseModal()">Закрыть</button>
    </div>
  `);
}

(function init() {
  loadDatabase();
  if(window.innerWidth <= 900) ui.view = 'day';
  render();
  updateNotifButton();
  if(ui.firebaseUrl) {
    pullFromFirebase(false);
    setupFirebaseRealtime();
  }
  
  window.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') handleAppResume();
  });
  window.addEventListener('focus', handleAppResume);
  window.addEventListener('online', handleAppResume);
  window.addEventListener('pageshow', (event) => {
    try {
      if (!db || !Array.isArray(db.events)) loadDatabase();
      render();
    } catch(err) {
      console.error('Ошибка pageshow:', err);
    }
  });

  window.addEventListener('beforeunload', (e) => {
    if (FormGuard.isDirty()) {
      e.preventDefault();
      e.returnValue = '';
      return '';
    }
    saveDatabase(false);
  });
})();
</script>
</body>
</html>
