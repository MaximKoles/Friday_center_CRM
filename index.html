        <button class="icon-btn sm" onclick="changeDayDate(-1)">${ic('chevLeft')}</button>
        <div class="font-bold text-lg text-center" style="min-width:180px">${DOW_FULL[dayOfWeek]}, ${d.getDate()} ${MONTHS_GEN[d.getMonth()]}</div>
        <button class="icon-btn sm" onclick="changeDayDate(1)">${ic('chevRight')}</button>
        <button class="btn btn-ghost btn-sm" onclick="ui.dayDate=getTodayISO();ui.selectedDayEventId=null;render()">Сегодня</button>
      </div>
    </div>
  `;

  if (!dayEvs.length) {
    html += `
      <div class="list-card text-center text-muted" style="padding:40px 20px;max-width:960px">
        <div style="margin-bottom:8px" class="flex justify-center">${ic('clock')}</div>
        <div class="font-bold text-base text-ink" style="margin-bottom:4px">Событий на этот день нет</div>
        <div class="text-sm">В расписании на этот день ничего не запланировано. Добавить событие можно во вкладке «Месяц».</div>
      </div>
    `;
    return html;
  }

  html += `
    <div class="day-tabs-scroll" style="max-width:960px">
      ${dayEvs.map(ev => {
        const isSel = activeEv && ev.id === activeEv.id;
        const p = PRESENCE[ev.presenceType] || PRESENCE.team;
        const isRent = ev.presenceType === 'rent';
        const isTrip = ev.presenceType === 'trip';
        const { booked, checked } = getEventStats(ev.id);
        const liveStatus = getEventLiveStatus(ev);
        
        let rightBadgeHtml = '';
        if (isTrip) {
          rightBadgeHtml = `<span class="tab-badge">отлучка</span>`;
        } else if (isRent) {
          rightBadgeHtml = `<span class="tab-badge" style="${ev.isPaid ? 'color:#059669' : 'color:#B45309'}">${ev.isPaid ? 'оплачено' : 'аренда'}</span>`;
        } else {
          rightBadgeHtml = `<span class="tab-badge">${checked}/${booked}</span>`;
        }

        let timeTagHtml = '';
        if (liveStatus === 'now') {
          timeTagHtml = `<span class="time-status-pill now"><span class="time-status-dot"></span>идёт</span>`;
        } else if (liveStatus === 'soon') {
          timeTagHtml = `<span class="time-status-pill soon"><span class="time-status-dot"></span>скоро</span>`;
        }

        return `
          <div class="day-tab ${isSel ? 'active' : ''}" onclick="selectDayEvent('${ev.id}')">
            <span class="day-tab-line" style="background:${p.color}"></span>
            <div style="min-width:0;flex:1">
              <div class="font-bold text-sm truncate">${esc(ev.title)}</div>

                ${rightBadgeHtml}
                ${timeTagHtml}
              </div>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;

  if (activeEv) {
    html += renderEventDetailsCardHtml(activeEv, { isModal: false });
  }

  return html;
}

function handleModalEditGuest(e, bookingId, eventId, returnToModalId = null) {
  e.preventDefault();
  lockSubmitBtn(e);

  const b = db.bookings.find(x => x.id === bookingId);
  if (!b) return;

  const name = document.getElementById('mBkName').value.trim();
  let tg = document.getElementById('mBkTg').value.trim();
  if (tg && !tg.startsWith('@') && !tg.startsWith('http')) tg = '@' + tg;
  const count = Math.max(1, parseInt(document.getElementById('mBkCount').value) || 1);
  
  const paymentStatus = normalizePaymentStatus(document.getElementById('mBkPaymentStatus')?.value);
  const isPaid = (paymentStatus === 'paid');
  
  const isWait = document.getElementById('mBkWait').checked;
  const isFav = document.getElementById('mBkFavVal') ? document.getElementById('mBkFavVal').value === '1' : false;
  const note = document.getElementById('mBkNote').value.trim();
  const stamp = nowTs();
  const prevGuestName = b.guestName;
  const prevPayStatus = normalizePaymentStatus(b.paymentStatus, b.isPaid);

  b.guestName = name;
  b.telegram = tg;
  b.ticketsCount = count;
  b.paymentStatus = paymentStatus;
  b.isPaid = isPaid;
  b.isWaitlist = isWait;
  b.isFavorite = isFav;
  b.note = note;
  // Ручная сумма оплаты: пустое поле → авто-расчёт (снимок цены × места)
  const manualAmt = parseManualAmountInput('mBkPaidAmount');
  if (manualAmt === undefined) { delete b.paidAmount; } else { b.paidAmount = manualAmt; }
  // Переименование гостя обновляет имя во всех его бронях (иначе список «расползается»)
  if (b.clientId && prevGuestName !== name) {
    db.bookings.forEach(x => {
      if (x.clientId === b.clientId && x.id !== b.id && x.guestName !== name) {
        x.guestName = name;
        x.updatedAt = stamp;
      }
    });
  }
  if (prevPayStatus !== paymentStatus) b.payAt = stamp;
  b.updatedAt = stamp;

  if (b.clientId) {
    const c = db.clients.find(x => x.id === b.clientId);
    if (c) {
      c.name = name;
      if (tg) c.telegram = tg;
      const stats = getClientStats(c.id);
      c.visitsCount = stats.visits;
      c.totalPaid = stats.total;
      c.lastSeen = stats.lastSeen;
      c.updatedAt = stamp;
    }
  }

  logAct('bk_edit', `${name} · ${b.eventTitle || ''}`);
  saveDatabase(true);
  if (returnToModalId) {
    openEventDetailsModal(returnToModalId);
  } else {
    forceCloseModal();
  }
  render();
  toast('Запись гостя обновлена');
}

function toggleModalFav() {
  const hiddenInp = document.getElementById('mBkFavVal');
  const btn = document.getElementById('mBkFavBtn');
  if (!hiddenInp || !btn) return;
  const isNowFav = hiddenInp.value === '1' ? '0' : '1';
  hiddenInp.value = isNowFav;
  if (isNowFav === '1') {
    btn.classList.add('on');
    btn.innerHTML = `<svg><use href="#ic-star"/></svg>`;
    btn.style.borderColor = 'var(--star)';
  } else {
    btn.classList.remove('on');
    btn.innerHTML = `<svg><use href="#ic-starOutline"/></svg>`;
    btn.style.borderColor = 'var(--line2)';
  }
}

function handleModalAddGuest(e, evId, returnToModalId = null) {
  e.preventDefault();
  lockSubmitBtn(e);

  const name = document.getElementById('mBkName').value.trim();
  let tg = document.getElementById('mBkTg').value.trim();
  if (tg && !tg.startsWith('@') && !tg.startsWith('http')) tg = '@' + tg;
  const count = Math.max(1, parseInt(document.getElementById('mBkCount').value) || 1);
  
  const paymentStatus = normalizePaymentStatus(document.getElementById('mBkPaymentStatus')?.value);
  const isPaid = (paymentStatus === 'paid');

  const isWait = document.getElementById('mBkWait').checked;
  const isFav = document.getElementById('mBkFavVal') ? document.getElementById('mBkFavVal').value === '1' : false;
  const note = document.getElementById('mBkNote').value.trim();

  const ev = db.events.find(x => x.id === evId);
  const stamp = nowTs();
  const manualAmt = parseManualAmountInput('mBkPaidAmount');

  let client = null;
  if (tg) client = db.clients.find(c => c.telegram && c.telegram.toLowerCase() === tg.toLowerCase());
  if (!client) client = db.clients.find(c => c.name.toLowerCase() === name.toLowerCase());

  if (!client) {
    const newId = getStableClientId(tg, name);
    if (db.deletedIds && db.deletedIds[newId]) {
      delete db.deletedIds[newId];
    }
    client = {
      id: newId,
      telegram: tg,
      name,
      visitsCount: 0,
      totalPaid: 0,
      initialVisits: 0,
      initialPaid: 0,
      clientNotes: note,
      firstSeen: getTodayISO(),
      lastSeen: null,
      initialLastSeen: null,
      updatedAt: stamp
    };
    db.clients.push(client);
  }

  const bkId = uid('bk');
  if (db.deletedIds && db.deletedIds[bkId]) {
    delete db.deletedIds[bkId];
  }

  const newBooking = {
    id: bkId,
    eventId: evId,
    clientId: client.id,
    guestName: name,
    telegram: tg,
    ticketsCount: count,
    paymentStatus,
    isPaid,
    isCheckedIn: false,
    isWaitlist: isWait,
    isFavorite: isFav,
    note,
    eventTitle: ev?.title || 'Событие',
    eventDate: ev?.date || getTodayISO(),
    eventTime: ev?.time || '19:00',
    eventPrice: ev?.price || 0,
    updatedAt: stamp
  };
  if (manualAmt !== undefined) newBooking.paidAmount = manualAmt;
  db.bookings.push(newBooking);

  const stats = getClientStats(client.id);
  client.visitsCount = stats.visits;
  client.totalPaid = stats.total;
  client.lastSeen = stats.lastSeen;
  client.updatedAt = stamp;

  logAct('bk_add', `${name}${count > 1 ? ` ×${count}` : ''} · ${ev?.title || ''}${isWait ? ' · резерв' : ''}`);
  saveDatabase(true);
  if (returnToModalId) {
    openEventDetailsModal(returnToModalId);
  } else {
    forceCloseModal();
  }
  render();
  if (ev && !isWait) {
    const capInfo = getEventCapacityInfo(ev);
    if (capInfo.cap > 0 && capInfo.left < 0) {
      toast(`⚠ Превышена вместимость: ${capInfo.booked}/${capInfo.cap}`);
      return;
    }
  }
  toast(isWait ? 'Добавлено в резерв' : 'Гость успешно записан');
}

      </div>
    </div>

    <div class="list-card" id="cList">${renderClientsRows(clients)}</div>
  `;
}

function renderAnalyticsView() {
  const isM = ui.analyticsPeriod === 'month';
  const curY = ui.year, curM = ui.month;
  const currentTab = ui.analyticsTab || 'events';

  const evs = db.events.filter(e => {
    if(!isM) return true;
    const d = parseYmd(e.date); return d.getFullYear() === curY && d.getMonth() === curM;
  });
  const evIds = new Set(evs.map(e => e.id));

  let totalRev = 0, totalCheckins = 0;
  const eventAnalyticsMap = new Map();

  evs.forEach(e => {
    let evRev = 0;
    const eventBookings = db.bookings.filter(b => b.eventId === e.id && !b.isWaitlist);
    
    eventBookings.forEach(b => {
      evRev += getBookingCollected(b, e);
    });

    if (e.presenceType === 'rent' && e.isPaid) {
      evRev += (Number(e.price) || 0);
    }

    if (evRev > 0) {
      totalRev += evRev;
      const peopleCount = eventBookings.reduce((sum, b) => sum + (Math.max(1, Number(b.ticketsCount) || 1)), 0);
      eventAnalyticsMap.set(e.id, {
        id: e.id,
        title: e.title,
        date: e.date,
        time: e.time,
        presenceType: e.presenceType,
        revenue: evRev,
        people: peopleCount
      });
    }
  });

  db.bookings.forEach(b => {
    if(evIds.has(b.eventId) && !b.isWaitlist && b.isCheckedIn) {
      totalCheckins += (Math.max(1, Number(b.ticketsCount) || 1));
    }
  });

  const revenueEvents = Array.from(eventAnalyticsMap.values()).sort((a,b) => b.revenue - a.revenue);
  const maxEventRev = Math.max(1, ...revenueEvents.map(x => x.revenue));

  const guestAnalyticsMap = new Map();

  db.bookings.forEach(b => {
    if(evIds.has(b.eventId) && !b.isWaitlist && normalizePaymentStatus(b.paymentStatus, b.isPaid) === 'paid') {
      const ev = db.events.find(x => x.id === b.eventId);
      const tickets = Math.max(1, Number(b.ticketsCount) || 1);
      const paidAmount = getBookingCollected(b, ev);

      if (paidAmount > 0) {
        const cId = b.clientId || getStableClientId(b.telegram, b.guestName);
        if (!guestAnalyticsMap.has(cId)) {
          const clientObj = db.clients.find(c => c.id === cId);
          guestAnalyticsMap.set(cId, {
            id: cId,
            name: b.guestName || clientObj?.name || 'Гость',
            telegram: b.telegram || clientObj?.telegram || '',
            revenue: 0,
            visits: 0
          });
        }
        const guestData = guestAnalyticsMap.get(cId);
        guestData.revenue += paidAmount;
        if (b.isCheckedIn) {
          guestData.visits += tickets;
        }
      }
    }
  });

  guestAnalyticsMap.forEach(g => {
    if (g.visits === 0) {
      const count = db.bookings
        .filter(b => evIds.has(b.eventId) && !b.isWaitlist && normalizePaymentStatus(b.paymentStatus, b.isPaid) === 'paid' && (b.clientId === g.id || b.guestName === g.name))
        .reduce((s,b)=>s+(Math.max(1, Number(b.ticketsCount) || 1)), 0);
      g.visits = count || 1;
    }
  });

  const revenueGuests = Array.from(guestAnalyticsMap.values()).sort((a,b) => b.revenue - a.revenue);
  const maxGuestRev = Math.max(1, ...revenueGuests.map(x => x.revenue));
  const years = [curY-1, curY, curY+1];

  return `
    <div class="page-head flex items-center justify-between gap-3 flex-wrap">
      <div>
        <div class="font-bold text-xl">Экспресс-аналитика пространства</div>
        ${isM ? `
          <div class="flex items-center gap-1.5 flex-wrap" style="margin-top:6px">
            <button class="icon-btn sm" onclick="changeMonth(-1)">${ic('chevLeft')}</button>
            <select class="inp bg-subtle" style="padding:4px 28px 4px 10px;height:32px;font-size:13px;font-weight:600;width:auto;border-radius:9px;border:none" onchange="ui.month=parseInt(this.value);render()">
              ${MONTHS.map((m, i) => `<option value="${i}" ${i===curM?'selected':''}>${m}</option>`).join('')}
            </select>
            <select class="inp bg-subtle" style="padding:4px 28px 4px 10px;height:32px;font-size:13px;font-weight:600;width:auto;border-radius:9px;border:none" onchange="ui.year=parseInt(this.value);render()">
              ${years.map(y => `<option value="${y}" ${y===curY?'selected':''}>${y}</option>`).join('')}
            </select>
            <button class="icon-btn sm" onclick="changeMonth(1)">${ic('chevRight')}</button>
            <button class="btn btn-ghost btn-sm" style="height:32px;min-height:32px" onclick="ui.year=new Date().getFullYear();ui.month=new Date().getMonth();render()">Текущий</button>
          </div>
        ` : `<div class="text-sm text-muted" style="margin-top:3px">За всё время работы (по оплаченным событиям)</div>`}
      </div>
      <div class="flex gap-2 flex-wrap">
        <button class="btn btn-soft btn-sm" onclick="exportAnalyticsXlsx()" title="Скачать .xlsx: события, гости, оплаты, клиенты">${ic('download')} Excel</button>
        <button class="chip ${isM?'on':''}" onclick="ui.analyticsPeriod='month';render()">Выбранный месяц</button>
        <button class="chip ${!isM?'on':''}" onclick="ui.analyticsPeriod='all';render()">Всё время</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat sc-team"><div class="stat-label">${ic('wallet')} Выручка</div><div class="stat-val font-bold">${money(totalRev)}</div></div>
      <div class="stat sc-free"><div class="stat-label">${ic('check')} Чекинов</div><div class="stat-val font-bold">${totalCheckins} чел.</div></div>
      <div class="stat sc-rent"><div class="stat-label">${ic('calendar')} С выручкой</div><div class="stat-val font-bold">${revenueEvents.length} из ${evs.length}</div></div>
      <div class="stat sc-acc"><div class="stat-label">${ic('users')} Платящих гостей</div><div class="stat-val font-bold">${revenueGuests.length} чел.</div></div>
    </div>

    <div class="flex items-center justify-between flex-wrap gap-2" style="margin: 14px 0 10px;">
      <div class="section-title" style="margin:0">
        ${currentTab === 'events' ? 'Мероприятия с выручкой за месяц' : 'Гости, оплатившие участие за месяц'}
      </div>
      <div class="chips" style="margin:0;gap:6px">
        <button class="chip ${currentTab==='events'?'on':''}" onclick="ui.analyticsTab='events';render()">
          ${ic('calendar')} События (${revenueEvents.length})
        </button>
        <button class="chip ${currentTab==='clients'?'on':''}" onclick="ui.analyticsTab='clients';render()">
          ${ic('users')} Гости (${revenueGuests.length})
        </button>
      </div>
    </div>

    <div class="list-card">
      ${currentTab === 'events' ? (
        revenueEvents.length === 0 ? `
          <div class="text-center text-muted" style="padding:28px 16px">
            <div style="margin-bottom:6px">${ic('calendar')}</div>
            <div class="font-semibold text-base text-ink">Нет мероприятий с полученной выручкой</div>
            <div class="text-xs" style="margin-top:2px">В этом месяце пока нет оплаченных бронирований или закрытых договоров аренды.</div>
          </div>
        ` : revenueEvents.map(ev => `
          <div class="row row-click flex items-center justify-between gap-3" onclick="openEventDetailsModal('${ev.id}')">
            <div class="bar-name">
              <div class="flex items-center gap-2 flex-wrap font-semibold">
                <span>${esc(ev.title)}</span>
                <span class="tag" style="background:${PRESENCE[ev.presenceType]?.bg};color:var(--ink2);font-size:10px;padding:2px 7px">
                  ${PRESENCE[ev.presenceType]?.label || ''}
                </span>
              </div>
              <div class="text-xs text-muted" style="margin-top:2px">
                ${fmtDateRu(ev.date)} · ${ev.time} · <b>${ev.people} ${plural(ev.people, 'человек', 'человека', 'человек')}</b>
              </div>
            </div>
            <div class="bar-track">
              <div class="bar-fill" style="width:${Math.round(ev.revenue / maxEventRev * 100)}%;background:var(--team)"></div>
            </div>
            <div class="bar-val font-bold text-ink">${money(ev.revenue)}</div>
          </div>
        `).join('')
      ) : (
        revenueGuests.length === 0 ? `
          <div class="text-center text-muted" style="padding:28px 16px">
            <div style="margin-bottom:6px">${ic('users')}</div>
            <div class="font-semibold text-base text-ink">Нет оплативших гостей за выбранный период</div>
            <div class="text-xs" style="margin-top:2px">Здесь отображаются гости, которые внесли оплату за события этого месяца.</div>
          </div>
        ` : revenueGuests.map(g => `
          <div class="row row-click flex items-center justify-between gap-3" onclick="openClientCardModal('${esc(g.id)}')">
            <div class="bar-name">
              <div class="flex items-center gap-2 flex-wrap font-semibold">
                <span>${esc(g.name)}</span>
                ${g.telegram ? `<span class="pill" style="font-size:10.5px">${esc(g.telegram)}</span>` : ''}
              </div>
              <div class="text-xs text-muted" style="margin-top:2px">
                <b>${g.visits} ${plural(g.visits, 'посещение', 'посещения', 'посещений')}</b> в этом месяце
              </div>
            </div>
            <div class="bar-track">
              <div class="bar-fill" style="width:${Math.round(g.revenue / maxGuestRev * 100)}%;background:var(--accent)"></div>
            </div>
            <div class="bar-val font-bold text-ink">${money(g.revenue)}</div>
          </div>
        `).join('')
      )}
    </div>
  `;
}

function render() {
  try {
    const top = document.getElementById('topNav'), bot = document.getElementById('bottomNav'), view = document.getElementById('view');
    const headerPill = document.getElementById('headerVersionPill');
    if (headerPill) headerPill.textContent = `v${APP_VERSION}`;
    if (!db) loadDatabase();
    if (top) top.innerHTML = NAV.map(n => `<button onclick="navTo('${n.id}')" class="${ui.view===n.id?'active':''}">${ic(n.icon)} ${n.label}</button>`).join('');
    if (bot) bot.innerHTML = NAV.map(n => `<button onclick="navTo('${n.id}')" class="${ui.view===n.id?'active':''}">${ic(n.icon)}<span>${n.label}</span></button>`).join('');
    renderSettingsBtn();
    updateNotifButton();
    if (view) {
      if(ui.view === 'month') view.innerHTML = renderMonthView();
      else if(ui.view === 'day') view.innerHTML = renderDayView();
      else if(ui.view === 'events') view.innerHTML = renderFormatsView();
      else if(ui.view === 'clients') view.innerHTML = renderClientsView();
      else if(ui.view === 'analytics') view.innerHTML = renderAnalyticsView();
    }
  } catch(err) {
    console.error('Ошибка рендера страницы:', err);
    const view = document.getElementById('view');
    if (view && !view.innerHTML.trim()) {
      loadDatabase();
      view.innerHTML = renderMonthView();
    }
  }
}

function openEventDetailsModal(id) {
  const ev = db.events.find(e => e.id === id); 
  if(!ev) return;
  ui.modal = { type: 'event', id };

  const p = PRESENCE[ev.presenceType] || PRESENCE.team;
  const innerHtml = renderEventDetailsCardHtml(ev, { isModal: true });

  openModal(`
    <div class="modal-head flex items-center justify-between gap-3">
      <div class="flex items-center gap-3.5 flex-wrap">
        <div class="modal-title">${fmtDateFull(ev.date)}</div>
        <span class="tag" style="background:${p.bg};color:var(--ink2);font-size:12px;padding:3.5px 11px;font-weight:600;margin-left:6px">
          <span class="dot" style="background:${p.color}"></span>${p.label}
        </span>
      </div>
      <button class="icon-btn sm" onclick="requestCloseModal()">${ic('x')}</button>
    </div>
    <div class="modal-body" style="padding:0">
      ${innerHtml}
    </div>
    <div class="modal-foot flex gap-2 justify-end">
      <button class="btn btn-primary btn-sm" onclick="requestCloseModal()">Готово</button>
    </div>
  `, { wide: true });
}

function confirmDeleteEventAction(id) {
  const ev = db.events.find(e => e.id === id);
  if (!ev) return;

  const isTrip = ev.presenceType === 'trip';
  const isRent = ev.presenceType === 'rent';

  let title = 'Удалить событие из графика?';
  let msg = `Удалить «${esc(ev.title)}» из календаря?<br><br><b>История посещений и оплаты гостей сохранятся в их карточках.</b>`;

  if (isTrip) {
    title = 'Удалить отлучку?';
    msg = `Удалить период отсутствия «${esc(ev.title)}» из календаря?`;
  } else if (isRent) {
    title = 'Удалить аренду?';
    msg = `Удалить запись об аренде «${esc(ev.title)}» из графика?`;
  }

  confirmAction(
    title,
    msg,
    'Удалить',
    () => { deleteEvent(id); }
  );
}

function toggleRentPayment(id) {
  const ev = db.events.find(e => e.id === id);
  if (!ev) return;
  ev.isPaid = !ev.isPaid;
  ev.updatedAt = nowTs();
  logAct('rent_pay', `${ev.title || ''} — ${ev.isPaid ? 'оплачено' : 'отметка снята'}`);
  saveDatabase(true);
  if (ui.modal?.type === 'event') openEventDetailsModal(id);
  render();
  toast(ev.isPaid ? 'Оплата аренды получена' : 'Отметка оплаты аренды снята');
}

let rtLogoImg = null, rtLogoTried = false;
function rtLogoImage() {
  return new Promise(res => {
    if (rtLogoTried) return res(rtLogoImg);
    rtLogoTried = true;
    const img = new Image();
    img.onload = () => { rtLogoImg = img; res(img); };
    img.onerror = () => res(null);
    img.src = RT_LOGO_SRC;
  });
}

// Межбуквенный интервал: поддерживается не во всех браузерах — просто пропускаем
function rtSetLS(ctx, v) { if ('letterSpacing' in ctx) ctx.letterSpacing = v; }

// Пятиконечная звезда — как звёздочка в логотипе
function rtStar(ctx, cx, cy, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const rad = i % 2 === 0 ? r : r * 0.45;
    const x = cx + Math.cos(a) * rad, y = cy + Math.sin(a) * rad;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath(); ctx.fill();
}

// Перенос текста на строки (не более maxLines, хвост — с многоточием)
function rtWrap(ctx, text, maxW, maxLines = 2) {
  const words = String(text ?? '').split(/\s+/).filter(Boolean);
  const lines = [];
  let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (cur && ctx.measureText(t).width > maxW) { lines.push(cur); cur = w; }
    else cur = t;
  }
  if (cur) lines.push(cur);
  if (lines.length > maxLines) {
    lines.length = maxLines;
    lines[maxLines - 1] = lines[maxLines - 1].trimEnd().replace(/\s+\S*$/, '') + ' …';
  }
  return lines;
}
const RENT_TICKET_FIELDS_KEY = 'pyatnitsa_rent_ticket_fields_v1';
const RENT_TICKET_FIELDS = [
  { id: 'title',  label: 'Название',      def: true },
  { id: 'price',  label: 'Сумма',         def: true },
  { id: 'admin',  label: 'Администратор', def: true },
  { id: 'client', label: 'Арендатор',     def: true },
  { id: 'paid',   label: 'Статус оплаты', def: false },
  { id: 'note',   label: 'Заметка',       def: false }
];

function getRentTicketFields() {
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(RENT_TICKET_FIELDS_KEY) || '{}') || {}; } catch (e) {}
  const res = {};
  RENT_TICKET_FIELDS.forEach(f => { res[f.id] = saved[f.id] === undefined ? f.def : Boolean(saved[f.id]); });
  return res;
}

// Есть ли в событии данные для поля: пустое поле на билете не рисуем
function rentTicketFieldHasData(ev, id) {
  if (!ev) return false;
  switch (id) {
    case 'title':  return Boolean(ev.title);
    case 'price':  return Number(ev.price) > 0;
    case 'admin':  return Boolean(ev.adminPerson);
    case 'client': return Boolean(ev.rentClientPerson);
    case 'paid':   return true;
    case 'note':   return Boolean(ev.note);
    default:       return false;
  }
}

function toggleRentTicketField(id) {
  const fields = getRentTicketFields();
  fields[id] = !fields[id];
  try { localStorage.setItem(RENT_TICKET_FIELDS_KEY, JSON.stringify(fields)); } catch (e) {}
  const chip = document.getElementById(`rtChip_${id}`);
  if (chip) chip.classList.toggle('on', fields[id]);
  drawRentTicket();
}

function openRentTicketModal(evId) {
  const ev = db.events.find(e => e.id === evId);
  if (!ev || ev.presenceType !== 'rent') return;
  ui.modal = { type: 'rentTicket', id: evId };

  const fields = getRentTicketFields();
  const chipsHtml = RENT_TICKET_FIELDS.map(f => {
    const has = rentTicketFieldHasData(ev, f.id);
    return `<button class="chip ${fields[f.id] && has ? 'on' : ''}" id="rtChip_${f.id}" ${has ? '' : 'disabled'} title="${has ? 'Показать или скрыть на билете' : 'В этом событии не заполнено'}" onclick="toggleRentTicketField('${f.id}')">${f.label}</button>`;
  }).join('');
  const canShare = typeof navigator.canShare === 'function';

  openModal(`

      <div>
        <div class="modal-title">Билет для арендатора</div>
        <div class="modal-sub">Картинка для отправки клиенту: он сверит дату и время</div>
      </div>
      <button class="icon-btn sm" onclick="requestCloseModal()">${ic('x')}</button>
    </div>
    <div class="modal-body">
      <div class="ticket-preview-wrap">
        <canvas id="rentTicketCanvas" width="${RENT_TICKET_W * 2}" height="${RENT_TICKET_H * 2}" style="width:min(100%,340px);margin:0 auto"></canvas>
      </div>
      <div class="field" style="margin-top:16px;margin-bottom:0">
        <label>Дополнительная информация на билете</label>
        <div class="chips" style="margin:0;gap:6px">${chipsHtml}</div>
      </div>
    </div>
    <div class="modal-foot flex gap-2 justify-end flex-wrap">
      <button class="btn btn-soft btn-sm" id="rtShareBtn" style="display:${canShare ? '' : 'none'}" onclick="shareRentTicket()">${ic('send')} Отправить…</button>
      <button class="btn btn-primary btn-sm" onclick="downloadRentTicket()">${ic('download')} Скачать PNG</button>
    </div>
  `);

  drawRentTicket();
}

function rtRoundRect(ctx, x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

function rtTruncate(ctx, text, maxW) {
  let t = String(text ?? '');
  if (ctx.measureText(t).width <= maxW) return t;
  while (t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
  return t.trimEnd() + '…';
}

async function drawRentTicket() {
  const canvas = document.getElementById('rentTicketCanvas');
  if (!canvas) return;
  const ev = db.events.find(e => e.id === ui.modal?.id);
  if (!ev) return;
  const fields = getRentTicketFields();

  // Ждём шрифты, чтобы Inter не подменялся системным при первом рендере
  try {
    await Promise.all([
      document.fonts.load('800 106px Inter'),
      document.fonts.load('800 94px Inter'),
      document.fonts.load('700 44px Inter'),
      document.fonts.load('700 42px Inter'),
      document.fonts.load('700 34px Inter'),
      document.fonts.load('700 30px Inter'),
      document.fonts.load('600 22px Inter'),
      document.fonts.load('500 30px Inter'),
      document.fonts.load('500 25px Inter'),
      document.fonts.load('400 30px Inter')
    ]);
  } catch (e) {}

  if (!document.getElementById('rentTicketCanvas')) return; // модалку успели закрыть

  const ctx = canvas.getContext('2d');
  ctx.setTransform(2, 0, 0, 2, 0, 0);
  ctx.clearRect(0, 0, RENT_TICKET_W, RENT_TICKET_H);

  const W = RENT_TICKET_W, H = RENT_TICKET_H;
  const INK = '#1C1C1C', INK2 = '#454545', MUT = '#6E6E6E', MUT2 = '#8B8B8B', LINE = '#D5D5D2';
  const AMBER = '#D97706';

  // Полотно полностью непрозрачное: в Telegram прозрачность всё равно белеет,
  // поэтому перфорация рисуется явными «дырочками», а не вырезами
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, W, H);

  // Двойная рамка «отрывного билета»: внешняя сплошная + внутренняя пунктирная
  ctx.strokeStyle = INK; ctx.lineWidth = 3;
  rtRoundRect(ctx, 26, 30, W - 52, H - 60, 28); ctx.stroke();
  ctx.strokeStyle = LINE; ctx.lineWidth = 1.5; ctx.setLineDash([9, 9]);
  rtRoundRect(ctx, 38, 42, W - 76, H - 84, 20); ctx.stroke();
  ctx.setLineDash([]);

  // ---- Логотип «ПЯТНИЦА» ----
  const logo = await rtLogoImage();
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  if (logo && logo.width) {
    const LW = 460, LH = LW * logo.height / logo.width;
    ctx.drawImage(logo, (W - LW) / 2, 112, LW, LH);
  } else {
    // Запасной вариант, если логотип вдруг не загрузился
    ctx.font = '800 46px Inter, sans-serif'; ctx.fillStyle = INK;
    ctx.fillText('ПЯТНИЦА', W / 2, 162);
    ctx.font = '600 17px Inter, sans-serif'; ctx.fillStyle = INK2; rtSetLS(ctx, '4px');
    ctx.fillText('ЦЕНТР ПРИТЯЖЕНИЯ', W / 2, 194); rtSetLS(ctx, '0px');
  }

  // ---- Заголовок: — ★ ВАША АРЕНДА ★ — (тихая строка в обрамлении линеек) ----
  ctx.font = '700 30px Inter, sans-serif';
  ctx.fillStyle = MUT; rtSetLS(ctx, '8px');
  const headText = 'ВАША АРЕНДА';
  const headW = ctx.measureText(headText).width;
  ctx.fillText(headText, W / 2, 340);
  rtSetLS(ctx, '0px');
  const headL = (W - headW) / 2, headR = (W + headW) / 2, lineY = 329;
  ctx.strokeStyle = LINE; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(118, lineY); ctx.lineTo(headL - 38, lineY);
  ctx.moveTo(headR + 38, lineY); ctx.lineTo(W - 118, lineY);
  ctx.stroke();
  ctx.fillStyle = INK;
  rtStar(ctx, headL - 21, lineY, 9); rtStar(ctx, headR + 21, lineY, 9);

  // Название события (по чипсу «Название»)
  if (fields.title && ev.title) {
    ctx.font = '500 30px Inter, sans-serif'; ctx.fillStyle = INK2;
    ctx.fillText(rtTruncate(ctx, ev.title, W - 220), W / 2, 406);
  }

  // ---- Герой: один плотный блок «день недели / дата / время» ----
  const d = parseYmd(ev.date);
  const weekday = (DOW_FULL[(d.getDay() + 6) % 7] || '').toUpperCase();
  ctx.font = '700 34px Inter, sans-serif'; ctx.fillStyle = INK; rtSetLS(ctx, '6px');
  ctx.fillText(weekday, W / 2, 506); rtSetLS(ctx, '0px');

  const dateMain = `${d.getDate()} ${MONTHS_GEN[d.getMonth()]}`;
  let df = 106;
  ctx.font = `800 ${df}px Inter, sans-serif`;
  const w1a = ctx.measureText(dateMain).width;
  ctx.font = '700 44px Inter, sans-serif';
  const w2 = ctx.measureText(String(d.getFullYear())).width;
  if (w1a + 24 + w2 > W - 150) {
    df = Math.max(60, Math.floor(df * (W - 150) / (w1a + 24 + w2)));
    ctx.font = `800 ${df}px Inter, sans-serif`;
  }
  const w1 = ctx.measureText(dateMain).width;
  const dateTotal = w1 + 24 + w2, dateX = (W - dateTotal) / 2;
  ctx.textAlign = 'left';
  ctx.fillStyle = AMBER; // единственный цвет на билете — дата, взгляд цепляется за неё
  ctx.fillText(dateMain, dateX, 642);
  ctx.font = '700 44px Inter, sans-serif'; ctx.fillStyle = MUT2;
  ctx.fillText(String(d.getFullYear()), dateX + w1 + 24, 642);
  ctx.textAlign = 'center';

  const endT = ev.endTime && toMin(ev.endTime) > toMin(ev.time) ? ev.endTime : '';
  const timeText = endT ? `${ev.time} — ${endT}` : (ev.time || '');
  if (timeText) {
    let tf = 94;
    ctx.font = `800 ${tf}px Inter, sans-serif`;
    let tw = ctx.measureText(timeText).width;
    while (tw > W - 200 && tf > 40) {
      tf -= 4; ctx.font = `800 ${tf}px Inter, sans-serif`;
      tw = ctx.measureText(timeText).width;
    }
    ctx.fillStyle = INK;
    ctx.fillText(timeText, W / 2, 768);
  }

  // Короткая черта под временем — точка завершения герой-блока
  ctx.fillStyle = INK;
  rtRoundRect(ctx, W / 2 - 60, 800, 120, 7, 3.5); ctx.fill();

  // ---- Перфорация: пунктир + нарисованные «дырочки» (фон непрозрачный) ----
  const perfY = 902;
  ctx.strokeStyle = '#C4C4C4'; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.setLineDash([3, 16]);
  ctx.beginPath(); ctx.moveTo(108, perfY); ctx.lineTo(W - 108, perfY); ctx.stroke();
  ctx.setLineDash([]);
  [76, W - 76].forEach(x => {
    ctx.beginPath(); ctx.arc(x, perfY, 16, 0, Math.PI * 2);
    ctx.fillStyle = '#FFFFFF'; ctx.fill();
    ctx.strokeStyle = '#9A9A9A'; ctx.lineWidth = 2.5; ctx.stroke();
  });

  // ---- Отрывной корешок: детали аренды крупно, читаемо с телефона ----
  const grid = [];
  if (fields.price && Number(ev.price) > 0) grid.push({ l: 'Сумма', v: money(ev.price) });
  if (fields.client && ev.rentClientPerson) grid.push({ l: 'Арендатор', v: ev.rentClientPerson });
  if (fields.admin && ev.adminPerson) grid.push({ l: 'Администратор', v: ev.adminPerson });

  const PADX = 88, colW = (W - PADX * 2 - 44) / 2, rowH = 124, startY = 992;
  ctx.textAlign = 'left';
  grid.forEach((r, i) => {
    const x = PADX + (i % 2) * (colW + 44);
    const labelY = startY + Math.floor(i / 2) * rowH;
    ctx.font = '600 22px Inter, sans-serif'; ctx.fillStyle = MUT2; rtSetLS(ctx, '2.5px');
    ctx.fillText(r.l.toUpperCase(), x, labelY); rtSetLS(ctx, '0px');
    ctx.font = '700 42px Inter, sans-serif'; ctx.fillStyle = INK;
    ctx.fillText(rtTruncate(ctx, r.v, colW), x, labelY + 48);
  });

  let rowsUsed = Math.ceil(grid.length / 2);

  if (fields.paid) {
    const labelY = startY + rowsUsed * rowH;
    ctx.font = '600 22px Inter, sans-serif'; ctx.fillStyle = MUT2; rtSetLS(ctx, '2.5px');
    ctx.fillText('ОПЛАТА', PADX, labelY); rtSetLS(ctx, '0px');
    ctx.font = `700 42px Inter, sans-serif`;
    ctx.fillStyle = ev.isPaid ? INK : MUT;
    ctx.fillText(rtTruncate(ctx, ev.isPaid ? 'Оплачено' : 'Оплата при встрече', W - PADX * 2), PADX, labelY + 48);
    rowsUsed++;
  }

  if (fields.note && ev.note) {
    const labelY = startY + rowsUsed * rowH + 10;
    ctx.font = '600 22px Inter, sans-serif'; ctx.fillStyle = MUT2; rtSetLS(ctx, '2.5px');
    ctx.fillText('ЗАМЕТКА', PADX, labelY); rtSetLS(ctx, '0px');
    ctx.font = '400 30px Inter, sans-serif'; ctx.fillStyle = INK2;
    rtWrap(ctx, ev.note, W - PADX * 2, 2).forEach((line, i) => {
      ctx.fillText(line, PADX, labelY + 46 + i * 40);
    });
  }

  // ---- Призыв подтвердить дату и время ----
  ctx.textAlign = 'center'; ctx.fillStyle = MUT;
  ctx.font = '500 25px Inter, sans-serif';
  ctx.fillText('Проверьте, пожалуйста, дату и время —', W / 2, H - 160);
  ctx.fillText('если всё верно, просто подтвердите', W / 2, H - 124);
}

function rentTicketFileName(ev) {
  return `bilet_arendy_${ev.date || ''}${ev.time ? '_' + String(ev.time).replace(':', '-') : ''}.png`;
}

function rentTicketCanvasBlob() {
  const canvas = document.getElementById('rentTicketCanvas');
  if (!canvas) return Promise.resolve(null);
  return new Promise(res => canvas.toBlob(res, 'image/png'));
}

function downloadRentTicket() {
  const ev = db.events.find(e => e.id === ui.modal?.id);
  if (!ev) return;
  rentTicketCanvasBlob().then(blob => {
    if (!blob) { toast('Не удалось создать PNG'); return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = rentTicketFileName(ev);
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    toast('Билет сохранён — отправьте его арендатору');
  });
}

async function shareRentTicket() {
  const ev = db.events.find(e => e.id === ui.modal?.id);
  if (!ev) return;
  const blob = await rentTicketCanvasBlob();
  if (!blob) { toast('Не удалось создать PNG'); return; }
  const file = new File([blob], rentTicketFileName(ev), { type: 'image/png' });
  if (!(navigator.canShare && navigator.canShare({ files: [file] }))) {
    toast('Отправка недоступна — скачайте PNG');
    return;
  }
  try {
    await navigator.share({
      files: [file],
      title: ev.title || 'Аренда',
      text: `Аренда: ${fmtDateFull(ev.date)}, ${ev.time}${ev.endTime ? '–' + ev.endTime : ''}. Проверьте, пожалуйста, дату и время.`
    });
  } catch (e) { /* пользователь закрыл окно «Поделиться» — это не ошибка */ }
}

      if (el) el.style.display = 'none';
    });

function showGuestSuggestions(query, targetField) {
  let boxId = '';
  if (targetField === 'name') boxId = 'acNameBox';
  else if (targetField === 'tg') boxId = 'acTgBox';
  else if (targetField === 'modal_name') boxId = 'acModalNameBox';
  else if (targetField === 'modal_tg') boxId = 'acModalTgBox';
  else if (targetField === 'ev_admin') boxId = 'acEvAdminBox';
  else if (targetField === 'ev_client') boxId = 'acEvRentClientBox';

  const box = document.getElementById(boxId);
  if (!box || !db?.clients?.length) return;

  ['acNameBox', 'acTgBox', 'acModalNameBox', 'acModalTgBox', 'acEvAdminBox', 'acEvRentClientBox'].forEach(id => {
    if (id !== boxId) {
      const el = document.getElementById(id);
      if (el) el.style.display = 'none';
    }
  });

  const q = String(query || '').toLowerCase().trim().replace(/^@/, '');
  let matches = [];

  if (!q) {
    matches = [...db.clients]
      .sort((a,b) => (b.visitsCount || 0) - (a.visitsCount || 0))
      .slice(0, 6);
  } else {
    matches = db.clients.filter(c => {
      const matchName = (c.name || '').toLowerCase().includes(q);
      const matchTg = (c.telegram || '').toLowerCase().replace(/^@/, '').includes(q);
      return matchName || matchTg;
    }).slice(0, 8);
  }

  if (!matches.length) {
    box.style.display = 'none';
    box.innerHTML = '';
    return;
  }

  box.innerHTML = matches.map(c => `
    <div class="autocomplete-item" onmousedown="selectGuestSuggestion('${esc(c.id)}', '${targetField}')">
      <div style="min-width:0;flex:1">
        <div class="font-semibold text-base truncate">${esc(c.name)}</div>
        <div class="text-xs text-muted truncate">${c.telegram ? esc(c.telegram) : 'Без Telegram'}${c.clientNotes ? ' · ' + esc(c.clientNotes) : ''}</div>
      </div>
      ${c.visitsCount > 0 ? `<span class="pill text-xs flex-none">${c.visitsCount} виз.</span>` : ''}
    </div>
  `).join('');

  box.style.display = 'block';
}

function selectGuestSuggestion(clientId, targetField = 'name') {
  const c = db.clients.find(x => x.id === clientId);
  if (!c) return;

  if (targetField === 'ev_admin') {
    const el = document.getElementById('evAdmin');
    if (el) el.value = c.name + (c.telegram ? ` (${c.telegram})` : '');
  } else if (targetField === 'ev_client') {
    const el = document.getElementById('evRentClient');
    if (el) el.value = c.name + (c.telegram ? ` (${c.telegram})` : '');
  } else {
    const isModal = targetField === 'modal_name' || targetField === 'modal_tg';
    const nameInp = document.getElementById(isModal ? 'mBkName' : 'bkName');
    const tgInp = document.getElementById(isModal ? 'mBkTg' : 'bkTg');
    if (nameInp) nameInp.value = c.name || '';
    if (tgInp) tgInp.value = c.telegram || '';
  }

  ['acNameBox', 'acTgBox', 'acModalNameBox', 'acModalTgBox', 'acEvAdminBox', 'acEvRentClientBox'].forEach(boxId => {
    const el = document.getElementById(boxId);
    if (el) el.style.display = 'none';
  });
}

function toggleCheckin(id) {
  const b = db.bookings.find(x => x.id === id); if(!b) return;
  b.isCheckedIn = !b.isCheckedIn;
  b.checkinAt = nowTs();
  b.updatedAt = b.checkinAt;

  const stats = getClientStats(b.clientId);
  const c = db.clients.find(x => x.id === b.clientId);
  if(c) {
    c.visitsCount = stats.visits;
    c.totalPaid = stats.total;
    c.lastSeen = stats.lastSeen;
    c.updatedAt = b.updatedAt;
  }
  logAct('checkin', `${b.guestName || ''} · ${b.eventTitle || ''} — ${b.isCheckedIn ? 'пришёл' : 'отметка снята'}`);
  saveDatabase(true);

  // Точечно обновляем все строки гостя (страница + модалка) и счётчики чипсов
  const rows = document.querySelectorAll(`[id="guestRow_${b.id}"]`);
  if (rows.length) {
    rows.forEach(row => {
      const btn = row.querySelector('.checkin-btn');
      if (btn) {
        if (b.isCheckedIn) {
          btn.classList.add('on');
          btn.innerHTML = ic('check');
        } else {
          btn.classList.remove('on');
          btn.innerHTML = '';
        }
      }
      const nameEl = row.querySelector('.guest-info-block .font-bold');
      if (nameEl) {
        nameEl.style.textDecoration = b.isCheckedIn ? 'line-through' : '';
        nameEl.style.opacity = b.isCheckedIn ? '0.65' : '';
      }
    });
    refreshDayGuestChips(b.eventId);
  } else {
    render();
  }
}

function togglePayment(id) {
  const b = db.bookings.find(x => x.id === id); if(!b) return;
  
  const currentStatus = normalizePaymentStatus(b.paymentStatus, b.isPaid);
  const nextStatus = getNextPaymentStatus(currentStatus);
  
  b.paymentStatus = nextStatus;
  b.isPaid = (nextStatus === 'paid');
  b.payAt = nowTs();
  b.updatedAt = b.payAt;

  const stats = getClientStats(b.clientId);
  const c = db.clients.find(x => x.id === b.clientId);
  if(c) {
    c.visitsCount = stats.visits;
    c.totalPaid = stats.total;
    c.lastSeen = stats.lastSeen;
    c.updatedAt = b.updatedAt;
  }
  logAct('pay', `${b.guestName || ''} · ${b.eventTitle || ''} — ${PAYMENT_STATUSES[nextStatus]?.label || nextStatus}`);
  saveDatabase(true);

  // Точечно обновляем ВСЕ строки этого гостя (страница + открытая модалка) без сброса скролла
  const evTp = db.events.find(x => x.id === b.eventId);
  const rows = document.querySelectorAll(`[id="guestRow_${b.id}"]`);
  if (rows.length) {
    const cfg = PAYMENT_STATUSES[nextStatus] || PAYMENT_STATUSES.unpaid;
    const collectedNow = getBookingCollected(b, evTp);
    const sumTxt = collectedNow > 0 ? money(collectedNow) : '';
    rows.forEach(row => {
      row.querySelectorAll('.pay-pill-btn').forEach(payBtn => {
        payBtn.className = `pay-pill-btn ${cfg.cssClass}`;
        payBtn.textContent = cfg.label;
        payBtn.title = `Статус оплаты: ${cfg.shortLabel} (нажмите для переключения)`;
      });
      row.querySelectorAll(`[data-bk-sum="${b.id}"]`).forEach(sumEl => { sumEl.textContent = sumTxt; });
    });
    // Мгновенно пересчитываем тег «Собрано» в шапке события (страница + модалка)
    refreshCollectedTags(b.eventId);
  } else {
    render();
  }
  
  const statusLabels = {
    paid: 'Оплата отмечена (Оплачено)',
    free: 'Установлен статус: Бесплатно',
    unpaid: 'Статус сброшен: Не оплачено'
  };
  toast(statusLabels[nextStatus] || 'Статус изменен');
}

function transferFromWaitlist(id) {
  const b = db.bookings.find(x => x.id === id);
  if(!b) return;
  b.isWaitlist = false;
  b.updatedAt = nowTs();
  logAct('waitlist', `${b.guestName || ''} · ${b.eventTitle || ''}`);
  saveDatabase(true);
  toast('Переведен в основной состав');
  if(ui.modal?.type === 'event') openEventDetailsModal(b.eventId);
  render();
}

function deleteFormat(id) {
  confirmAction('Удалить шаблон?','Удалить шаблон из реестра? Ранее созданные события сохранятся.','Удалить', () => {
    markAsDeleted(id);
    const fmtTitle = db.formats.find(x => x.id === id)?.title || '';
    db.formats = db.formats.filter(x => x.id !== id);
    // Чистим висячие ссылки на удалённый шаблон, чтобы не ломались фильтры и рендер
    db.events.forEach(e => {
      if (e.formatId === id) { e.formatId = ''; e.updatedAt = nowTs(); }
    });
    logAct('fmt_del', fmtTitle);
    saveDatabase(true);
    render();
    toast('Шаблон удален');
  });
}

function deleteEvent(id) {
  const idx = db.events.findIndex(x => x.id === id);
  if (idx < 0) return;
  const evSnapshot = JSON.parse(JSON.stringify(db.events[idx]));
  markAsDeleted(id);
  db.events = db.events.filter(x => x.id !== id);
  if (ui.selectedDayEventId === id) {
    ui.selectedDayEventId = null;
  }
  logAct('ev_del', `${evSnapshot.title} · ${evSnapshot.date || ''}`);
  saveDatabase(true);
  forceCloseModal();
  render();
  toastAction('Событие удалено из графика', 'Вернуть', () => undoDeleteEvent(evSnapshot, idx));
}

function undoDeleteEvent(evSnapshot, index) {
  if (db.events.some(x => x.id === evSnapshot.id)) { toast('Событие уже в графике'); return; }
  evSnapshot.updatedAt = nowTs();
  db.events.splice(Math.min(Math.max(index, 0), db.events.length), 0, evSnapshot);
  if (db.deletedIds) delete db.deletedIds[evSnapshot.id];
  logAct('ev_restore', evSnapshot.title || '');
  saveDatabase(true);
  render();
  toast('Событие возвращено в график');
}

function deleteBooking(id, evId) {
  confirmAction('Удалить запись?', 'Удалить бронь гостя из истории?', 'Удалить', () => {
    const b = db.bookings.find(x => x.id === id);
    if (!b) return;
    const clientId = b.clientId;
    const idx = db.bookings.findIndex(x => x.id === id);
    const bSnapshot = JSON.parse(JSON.stringify(b));
    markAsDeleted(id);
    db.bookings = db.bookings.filter(x => x.id !== id);
    logAct('bk_del', `${b.guestName || ''} · ${b.eventTitle || ''}`);
    if (clientId) {
      const stats = getClientStats(clientId);
      const c = db.clients.find(x => x.id === clientId);
      if (c) {
        c.visitsCount = stats.visits;
        c.totalPaid = stats.total;
        c.lastSeen = stats.lastSeen;
        c.updatedAt = nowTs();
      }
    }
    saveDatabase(true);
    if(evId && ui.modal?.type === 'event') openEventDetailsModal(evId);
    else if(ui.modal?.type === 'client') openClientCardModal(clientId);
    render();
    toastAction('Запись гостя удалена', 'Вернуть', () => undoDeleteBooking(bSnapshot, idx));
  });
}

function undoDeleteBooking(bSnapshot, index) {
  if (db.bookings.some(x => x.id === bSnapshot.id)) { toast('Такая запись уже существует'); return; }
  bSnapshot.updatedAt = nowTs();
  db.bookings.splice(Math.min(Math.max(index, 0), db.bookings.length), 0, bSnapshot);
  if (db.deletedIds) delete db.deletedIds[bSnapshot.id];
  logAct('bk_restore', `${bSnapshot.guestName || ''} · ${bSnapshot.eventTitle || ''}`);
  if (bSnapshot.clientId) {
    const c = db.clients.find(x => x.id === bSnapshot.clientId);
    if (c) {
      const stats = getClientStats(bSnapshot.clientId);
      c.visitsCount = stats.visits;
      c.totalPaid = stats.total;
      c.lastSeen = stats.lastSeen;
      c.updatedAt = nowTs();
    }
  }
  saveDatabase(true);
  if (bSnapshot.eventId && ui.modal?.type === 'event') openEventDetailsModal(bSnapshot.eventId);
  render();
  toast('Удаление отменено — запись восстановлена');
}

function deleteClient(clientId) {
  markAsDeleted(clientId);
  db.bookings.forEach(b => {
    if (b.clientId === clientId) {
      markAsDeleted(b.id);
    }
  });

  db.clients = db.clients.filter(x => x.id !== clientId);
  db.bookings = db.bookings.filter(b => b.clientId !== clientId);
  saveDatabase(true);
  render();
  toast('Гость удален');
}

function checkinAllForEvent(eventId) {
  const ev = db.events.find(x => x.id === eventId);
  if (!ev) return;
  const targets = db.bookings.filter(b => b.eventId === eventId && !b.isWaitlist && !b.isCheckedIn);
  if (!targets.length) { toast('Все гости уже отмечены как пришедшие'); return; }
  confirmAction(
    'Отметить всех пришедшими?',
    `Событие «${esc(ev.title)}»: будет отмечено записей — <b>${targets.length}</b>. Снять отметку, если кто-то отмечен случайно, можно отдельно по каждой записи.`,
    'Отметить всех',
    () => doCheckinAllForEvent(eventId)
  );
}

function doCheckinAllForEvent(eventId) {
  const ev = db.events.find(x => x.id === eventId);
  if (!ev) return;
  const targets = db.bookings.filter(b => b.eventId === eventId && !b.isWaitlist && !b.isCheckedIn);
  if (!targets.length) return;
  const stamp = nowTs();
  targets.forEach(b => { b.isCheckedIn = true; b.updatedAt = stamp; });
  const clientIds = [...new Set(targets.map(b => b.clientId).filter(Boolean))];
  clientIds.forEach(cid => {
    const c = db.clients.find(x => x.id === cid);
    if (c) {
      const stats = getClientStats(cid);
      c.visitsCount = stats.visits;
      c.totalPaid = stats.total;
      c.lastSeen = stats.lastSeen;
      c.updatedAt = stamp;
    }
  });
  logAct('checkin_all', `${ev.title || ''} · ${ev.date || ''} — записей: ${targets.length}`);
  saveDatabase(true);
  if (ui.modal?.type === 'event') openEventDetailsModal(eventId);
  render();
  toast(`Отмечены пришедшими: ${targets.length} ${targets.length === 1 ? 'запись' : 'записей'}`);
}

function updateEventFormVisibility(presenceType) {
  const rowFmt = document.getElementById('rowEvFmt');
  const rowFin = document.getElementById('rowEvFinance');
  const colPrice = document.getElementById('colEvPrice');
  const colCap = document.getElementById('colEvCapacity');
  const lblPrice = document.getElementById('lblEvPrice');
  const rowRentPaid = document.getElementById('rowEvRentPaid');
  const rowRentStaff = document.getElementById('rowRentStaff');
  const hintEl = document.getElementById('presenceTypeHint');
  const evP = document.getElementById('evP');
  const evC = document.getElementById('evC');

  if (!rowFin) return;

  if (presenceType === 'trip') {
    if (rowFmt) rowFmt.style.display = 'none';
    rowFin.style.display = 'none';
    if (rowRentStaff) rowRentStaff.style.display = 'none';
    if (rowRentPaid) rowRentPaid.style.display = 'none';
    if (evP) evP.disabled = true;
    if (evC) evC.disabled = true;
    if (hintEl) {
      hintEl.innerHTML = `<span class="tag" style="background:${PRESENCE.trip.bg};color:var(--ink2)"><span class="dot" style="background:${PRESENCE.trip.color}"></span>Отлучка</span> Время блокируется в расписании. Запись гостей отключена.`;
    }
  } else if (presenceType === 'rent') {
    if (rowFmt) rowFmt.style.display = '';
    rowFin.style.display = 'grid';
    if (rowRentStaff) rowRentStaff.style.display = 'grid';
    if (colPrice) colPrice.style.display = '';
    if (colCap) colCap.style.display = 'none';
    if (evP) evP.disabled = false;
    if (evC) evC.disabled = true;
    if (lblPrice) lblPrice.textContent = 'Стоимость аренды, ₽';
    if (rowRentPaid) rowRentPaid.style.display = 'block';
    if (hintEl) {
      hintEl.innerHTML = `<span class="tag" style="background:${PRESENCE.rent.bg};color:var(--ink2)"><span class="dot" style="background:${PRESENCE.rent.color}"></span>Аренда</span> За гостей отвечает арендатор. Доход учитывается в аналитике.`;
    }
  } else {
    if (rowFmt) rowFmt.style.display = '';
    rowFin.style.display = 'grid';
    if (rowRentStaff) rowRentStaff.style.display = 'none';
    if (colPrice) {
      colPrice.style.display = '';
      if (lblPrice) lblPrice.textContent = 'Цена билета, ₽';
    }
    if (colCap) colCap.style.display = '';
    if (evP) evP.disabled = false;
    if (evC) evC.disabled = false;
    if (rowRentPaid) rowRentPaid.style.display = 'none';
    if (hintEl) {
      hintEl.innerHTML = `<span class="tag" style="background:${PRESENCE[presenceType]?.bg};color:var(--ink2)"><span class="dot" style="background:${PRESENCE[presenceType]?.color}"></span>${PRESENCE[presenceType]?.label}</span> Регулярное мероприятие с записью и чекинами гостей.`;
    }
  }
}

function setPresencePicker(k, inpId = 'evPresence', pickerId = 'presencePicker') {
  const inp = document.getElementById(inpId); if(!inp) return;
  inp.value = k;
  document.querySelectorAll(`#${pickerId} .pres-opt`).forEach((el, idx) => {
    const key = Object.keys(PRESENCE)[idx];
    const isCur = key === k;
    el.className = `pres-opt ${isCur?'on':''}`;
    el.style.background = isCur ? PRESENCE[key].bg : '';
    el.style.boxShadow = isCur ? `inset 0 0 0 1.5px ${PRESENCE[key].color}` : '';
  });

  if (inpId === 'evPresence') {
    updateEventFormVisibility(k);
  }
}

function handleSaveEvent(e, editId, returnToEventId = null) {
  e.preventDefault();

  const titleInp = document.getElementById('evT');
  const title = (titleInp ? titleInp.value : '').trim();
  if (!title) {
    toast('Укажите название события');
    if (titleInp) titleInp.focus();
    return;
  }

  const date = document.getElementById('evD')?.value || ui.dayDate || getTodayISO();
  const time = document.getElementById('evStart')?.value || '19:00';
  let endTime = document.getElementById('evEnd')?.value || '21:00';
  const formatId = document.getElementById('evFmtSel') ? document.getElementById('evFmtSel').value : '';
  const presenceType = document.getElementById('evPresence')?.value || 'must';

  const priceInp = document.getElementById('evP');
  const price = (presenceType === 'trip') ? 0 : Math.max(0, parseFloat(priceInp?.value) || 0);

  const capInp = document.getElementById('evC');
  const capacity = (presenceType === 'trip' || presenceType === 'rent') ? 0 : Math.max(1, parseInt(capInp?.value) || 20);

  const rentPaidInp = document.getElementById('evRentPaid');
  const existingEv = editId ? db.events.find(x => x.id === editId) : null;
  const isPaid = (presenceType === 'rent')
    ? (rentPaidInp ? rentPaidInp.checked : Boolean(existingEv?.isPaid))
    : false;

  const adminPerson = (document.getElementById('evAdmin')?.value || '').trim() || 'Лена';
  const rentClientPerson = (document.getElementById('evRentClient')?.value || '').trim();
  const note = (document.getElementById('evN')?.value || '').trim();

  let startMin = toMin(time), endMin = toMin(endTime);
  if (endMin <= startMin) {
    const adj = Math.min(startMin + 120, 23 * 60 + 59);
    endTime = `${String(Math.floor(adj/60)).padStart(2,'0')}:${String(adj%60).padStart(2,'0')}`;
    endMin = toMin(endTime);
  }

  const payload = {
    title, formatId, date, time, endTime,
    price, capacity, presenceType,
    isPaid,
    adminPerson,
    rentClientPerson,
    contactPerson: adminPerson || 'Лена',
    note,
    updatedAt: nowTs()
  };

  const existingBookings = editId ? db.bookings.filter(b => b.eventId === editId) : [];
  const needsGuestHandling = (presenceType === 'trip' || presenceType === 'rent') && existingBookings.length > 0;

  const conflicts = db.events.filter(ev => {
    if (editId && ev.id === editId) return false;
    if (ev.date !== date) return false;
    const existing = getEventInterval(ev);
    return (startMin < existing.end && endMin > existing.start);
  });

  const commitSave = (clearBookings = false) => {
    lockSubmitBtn(e);

    let savedId = editId;
    if (editId) {
      const idx = db.events.findIndex(x => x.id === editId);
      if (idx !== -1) {
        db.events[idx] = { ...db.events[idx], ...payload };
      }
      if (clearBookings) {
        db.bookings.forEach(b => {
          if (b.eventId === editId) {
            b.eventId = '';
            b.isWaitlist = false;
            b.updatedAt = nowTs();
          }
        });
      } else {
        db.bookings.forEach(b => {
          if (b.eventId === editId) {
            b.eventTitle = payload.title;
            b.eventDate = payload.date;
            b.eventTime = payload.time;
            b.eventPrice = payload.price;
            b.updatedAt = nowTs();
          }
        });
      }
    } else {
      const newEvId = uid('ev');
      if (db.deletedIds && db.deletedIds[newEvId]) delete db.deletedIds[newEvId];
      db.events.push({ id: newEvId, ...payload });
      ui.selectedDayEventId = newEvId;
      savedId = newEvId;
    }

    logAct(editId ? 'ev_edit' : 'ev_add', `${payload.title} · ${payload.date}${clearBookings ? ' · гости откреплены' : ''}`);
    saveDatabase(true);
    if (returnToEventId && savedId) {
      openEventDetailsModal(savedId);
    } else {
      forceCloseModal();
    }
    render();
    toast('Событие сохранено');
  };

  if (needsGuestHandling) {
    const typeLabel = presenceType === 'trip' ? '«Отсутствую»' : '«Аренда»';
    openDialog(`
      <div class="dialog-box">
        <div class="dialog-icon-badge warn">${ic('alert')}</div>
        <div class="font-bold text-lg text-ink" style="margin-bottom:6px">Смена типа на ${typeLabel}</div>
        <div class="text-sm text-ink2" style="line-height:1.5;margin-bottom:18px">
          На это событие уже записано <b>${existingBookings.length} гостей</b>. 
          В формате ${typeLabel} список гостей пространства не ведётся.<br><br>
          Что сделать с записанными гостями?
        </div>
        <div class="flex flex-col gap-2">
          <button class="btn btn-primary btn-sm w-full" id="btnKeepGuestsHistory">
            Сохранить в истории гостей и открепить от события
          </button>
          <button class="btn btn-soft btn-sm w-full" id="btnDeleteGuestsBookings">
            Удалить эти бронирования
          </button>
          <button class="btn btn-ghost btn-sm w-full" onclick="closeDialog()">
            Отмена (остаться в форме)
          </button>
        </div>
      </div>
    `);

    document.getElementById('btnKeepGuestsHistory').onclick = () => {
      closeDialog();
      if (conflicts.length > 0) {
        showConflictConfirmation(conflicts, time, endTime, () => commitSave(true));
      } else {
        commitSave(true);
      }
    };

    document.getElementById('btnDeleteGuestsBookings').onclick = () => {
      closeDialog();
      existingBookings.forEach(b => {
        markAsDeleted(b.id);
      });
      db.bookings = db.bookings.filter(b => b.eventId !== editId);
      if (conflicts.length > 0) {
        showConflictConfirmation(conflicts, time, endTime, () => commitSave(false));
      } else {
        commitSave(false);
      }
    };

    return;
  }

  if (conflicts.length > 0) {
    showConflictConfirmation(conflicts, time, endTime, () => commitSave(false));
    return;
  }

  commitSave(false);
}

function showConflictConfirmation(conflicts, time, endTime, onConfirm) {
  const conflictList = conflicts
    .map(c => `• «${esc(c.title)}» (${c.time}–${c.endTime || '?'}, ${PRESENCE[c.presenceType]?.label || ''})`)
    .join('<br>');
  const msg = `В этот временной интервал (${time}–${endTime}) уже запланировано:<br><br>${conflictList}<br><br>Сохранить оба события?`;

  confirmAction(
    'Пересечение по времени',
    msg,
    'Всё равно сохранить',
    onConfirm,
    () => { }
  );
}

function handleSaveFormat(e, editId) {

function handleCreateClient(e) {
  e.preventDefault();
  lockSubmitBtn(e);
  const name = document.getElementById('clN').value.trim();
  let tg = document.getElementById('clTg').value.trim();
  if(tg && !tg.startsWith('@') && !tg.startsWith('http')) tg = '@' + tg;
  const notes = document.getElementById('clNotes').value.trim();

  let existing = null;
  if (tg) existing = db.clients.find(c => c.telegram && c.telegram.toLowerCase() === tg.toLowerCase());
  if (!existing) existing = db.clients.find(c => c.name.toLowerCase() === name.toLowerCase());

  const stamp = nowTs();
  if (existing) {
    existing.name = name;
    if (tg) existing.telegram = tg;
    if (notes) existing.clientNotes = existing.clientNotes ? `${existing.clientNotes} · ${notes}` : notes;
    const stats = getClientStats(existing.id);
    existing.visitsCount = stats.visits;
    existing.totalPaid = stats.total;
    existing.lastSeen = stats.lastSeen;
    existing.updatedAt = stamp;
    if (db.deletedIds && db.deletedIds[existing.id]) {
      delete db.deletedIds[existing.id];
    }
    toast(`Данные гостя «${name}» обновлены`);
  } else {
    const newId = getStableClientId(tg, name);
    if (db.deletedIds && db.deletedIds[newId]) {
      delete db.deletedIds[newId];
    }
    const newClient = {
      id: newId,
      telegram: tg,
      name,
      visitsCount: 0,
      totalPaid: 0,
      initialVisits: 0,
      initialPaid: 0,
      clientNotes: notes,
      firstSeen: getTodayISO(),
      lastSeen: null,
      initialLastSeen: null,
      updatedAt: stamp
    };
    db.clients.push(newClient);
    const stats = getClientStats(newId);
    newClient.visitsCount = stats.visits;
    newClient.totalPaid = stats.total;
    newClient.lastSeen = stats.lastSeen;
    toast(`Гость «${name}» добавлен`);
  }

  saveDatabase(true);
  forceCloseModal();
  render();
}

function parseSmartImportLines(txt, type) {
  const lines = txt.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const evs = [], clients = [];
  lines.forEach(line => {
    let parts = line.includes('\t') ? line.split('\t').map(s=>s.trim()).filter(Boolean) : line.split(/\s{2,}|;/).map(s=>s.trim()).filter(Boolean);
    if(parts.length < 3) {
      const lm = line.match(/^(\d{1,2}[./-]\d{1,2}[./-]\d{2,4})\s+(\d{1,2}:\d{2}(?:\s*[-–—]\s*\d{1,2}:\d{2})?)\s+(.+)$/);
      if(lm) {
        const rem = lm[3].trim();
        const pm = rem.match(/^(.*?)(?:\s+((?:(?:орг\.?\s*взнос|взнос|билет|цена)[:\s]*)?\d[\d\s]*\s*(?:₽|руб\.?|р\b)?|(?:бесплатно|вход свободный|донейшн)))$/i);
        parts = pm ? [lm[1], lm[2], pm[1].trim(), pm[2].trim()] : [lm[1], lm[2], rem];
      }
    }
    if(!parts.length) return;
    const dm = parts[0].match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})/) || parts[0].match(/^(\d{4})[./-](\d{1,2})[./-](\d{1,2})/);
    if(type === 'events' || dm) {
      if(!dm) return;
      let iso = '';
      if(dm[0].startsWith('20')) {
        const [, y, m, d] = dm; iso = `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;
      } else {
        let [, d, m, y] = dm; if(y.length === 2) y = '20' + y;
        iso = `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;
      }
      let t = parts[1] || '19:00', endT = '';
      if(/[-–—]/.test(t)) { const sp = t.split(/[-–—]/).map(s=>s.trim()); t = sp[0]; endT = sp[1]; }
      if(!t.includes(':')) t = '19:00';
      if(!endT) { const [h,m] = t.split(':').map(Number); endT = `${String(Math.min(23, (h||0)+2)).padStart(2,'0')}:${String(m||0).padStart(2,'0')}`; }
      const title = parts[2] || 'Встреча';
      const note = parts.slice(3).join(' ') || '';
      let pr = 0;
      if(note) {
        if(!/бесплатно|свободн|донейшн/i.test(note)) {
          const num = note.match(/\d[\d\s]*\d|\d/);
          if(num) pr = parseInt(num[0].replace(/\s+/g,''), 10) || 0;
        }
      }
      evs.push({ title, date: iso, time: t, endTime: endT, price: Math.max(0, pr), note });
    } else {
      const name = parts[0];
      const tg = parts.find(p => p.includes('@') || p.includes('t.me')) || '';
      const notes = parts.filter(p => p !== name && p !== tg).join(' · ');
      clients.push({ name, telegram: tg.startsWith('@') || tg.startsWith('http') || !tg ? tg : '@' + tg, notes });
    }
  });
  return { evs, clients };
}

function executeImport() {
  const txt = document.getElementById('impTxt').value.trim(); if(!txt) return;
  const { evs, clients } = parseSmartImportLines(txt, importType);
  if(importType === 'events' && !evs.length) { toast('Не удалось распознать события'); return; }
  if(importType === 'clients' && !clients.length) { toast('Не удалось распознать гостей'); return; }

  const run = () => {
    const stamp = nowTs();
    if(importMode === 'replace') {
      try { localStorage.setItem(STORE_BACKUP_KEY, JSON.stringify(db)); } catch(e){}
    }

    if(importType === 'events') {
      if(importMode === 'replace') { db.events = []; db.bookings = []; }
      evs.forEach(it => {
        let fmt = db.formats.find(x => x.title.toLowerCase() === it.title.toLowerCase());
        if(!fmt) {
          const newFmtId = uid('fmt');
          if (db.deletedIds && db.deletedIds[newFmtId]) delete db.deletedIds[newFmtId];
          fmt = { id: newFmtId, title: it.title, shortDescription: it.note, defaultPrice: it.price, defaultCapacity: 20, frequencyDays: 21, defaultPresence: 'must', updatedAt: stamp };
          db.formats.push(fmt);
        }
        const newEvId = uid('ev');
        if (db.deletedIds && db.deletedIds[newEvId]) delete db.deletedIds[newEvId];
        db.events.push({ id: newEvId, formatId: fmt.id, title: it.title, date: it.date, time: it.time, endTime: it.endTime, price: it.price, capacity: 20, presenceType: 'must', note: it.note, updatedAt: stamp });
      });
      const first = parseYmd(evs[0].date);
      ui.year = first.getFullYear(); ui.month = first.getMonth(); ui.dayDate = evs[0].date; ui.view = 'month';
    } else {
      if(importMode === 'replace') db.clients = [];
      clients.forEach(c => {
        let existing = null;
        if (c.telegram) existing = db.clients.find(x => x.telegram && x.telegram.toLowerCase() === c.telegram.toLowerCase());
        if (!existing) existing = db.clients.find(x => x.name.toLowerCase() === c.name.toLowerCase());

        if (existing) {
          if (c.notes) existing.clientNotes = existing.clientNotes ? `${existing.clientNotes} · ${c.notes}` : c.notes;
          existing.updatedAt = stamp;
          if (db.deletedIds && db.deletedIds[existing.id]) delete db.deletedIds[existing.id];
        } else {
          const newClId = getStableClientId(c.telegram, c.name);
          if (db.deletedIds && db.deletedIds[newClId]) delete db.deletedIds[newClId];
          db.clients.push({
            id: newClId,
            telegram: c.telegram,
            name: c.name,
            visitsCount: 0,
            totalPaid: 0,
            clientNotes: c.notes,
            firstSeen: getTodayISO(),
            lastSeen: null,
            updatedAt: stamp
          });
        }
      });
      cleanupClientDuplicates(db);
      ui.view = 'clients';
    }
    saveDatabase(true);
    forceCloseModal();
    render();
    toast(`Импортировано: ${importType==='events'?evs.length:clients.length}`);
  };

  if(importMode === 'replace') {
    confirmAction('Заменить все данные?', 'Будет создан авто-бэкап. Текущие записи выбранного типа будут заменены новыми. Продолжить?', 'Да, заменить', run);
  } else run();
}

// ============================================================================
// ЭКСПОРТ В EXCEL (.xlsx) без внешних библиотек.
// xlsx — это ZIP из XML. Собираем минимальный ZIP (метод store, без сжатия)
// и 4 листа: Сводка, События, Гости и оплаты, Клиенты.
// ============================================================================
const _crcTable = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[n] = c >>> 0; }
  return t;
})();
function _crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = _crcTable[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
const _xmlEsc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[ch]));
function _colName(n) { let s = ''; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; }

// rows: массив строк; ячейка — число (число), строка (текст) или {v, wrap:true}
function _sheetXml(rows) {
  let body = '';
  rows.forEach((cells, ri) => {
    let rowXml = '';
    (cells || []).forEach((val, ci) => {
      const ref = `${_colName(ci + 1)}${ri + 1}`;
      if (val === null || val === undefined || val === '') return;
      if (typeof val === 'number' && Number.isFinite(val)) {
        rowXml += `<c r="${ref}"><v>${val}</v></c>`;
      } else {
        const t = _xmlEsc(typeof val === 'object' ? val.v : val);
        rowXml += `<c r="${ref}" t="inlineStr" s="0"><is><t xml:space="preserve">${t}</t></is></c>`;
      }
    });
    if (rowXml) body += `<row r="${ri + 1}">${rowXml}</row>`;
  });
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${body}</sheetData></worksheet>`;
}

function _zipStore(files) {
  const enc = new TextEncoder();
  const u16 = v => new Uint8Array([v & 255, (v >> 8) & 255]);
  const u32 = v => new Uint8Array([v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255]);
  const parts = [], central = [];
  let offset = 0;
  const dosTime = u16(0), dosDate = u16(((2024 - 1980) << 9) | (1 << 5) | 1);
  files.forEach(f => {
    const nameB = enc.encode(f.name), data = enc.encode(f.data);
    const crc = _crc32(data), size = data.length;
    const lfh = new Uint8Array(30);
    lfh.set(u32(0x04034b50), 0); lfh.set(u16(20), 4); lfh.set(u16(0x0800), 6);
    lfh.set(u16(0), 8); lfh.set(dosTime, 10); lfh.set(dosDate, 12);
    lfh.set(u32(crc), 14); lfh.set(u32(size), 18); lfh.set(u32(size), 22);
    lfh.set(u16(nameB.length), 26); lfh.set(u16(0), 28);
    const cdh = new Uint8Array(46);
    cdh.set(u32(0x02014b50), 0); cdh.set(u16(20), 4); cdh.set(u16(20), 6); cdh.set(u16(0x0800), 8);
    cdh.set(u16(0), 10); cdh.set(dosTime, 12); cdh.set(dosDate, 14);
    cdh.set(u32(crc), 16); cdh.set(u32(size), 20); cdh.set(u32(size), 24);
    cdh.set(u16(nameB.length), 28); cdh.set(u32(offset), 42);
    central.push({ hdr: cdh, nameB });
    parts.push(lfh, nameB, data);
    offset += 30 + nameB.length + size;
  });
  let cdSize = 0;
  central.forEach(c => cdSize += c.hdr.length + c.nameB.length);
  const eocd = new Uint8Array(22);
  eocd.set(u32(0x06054b50), 0);
  eocd.set(u16(central.length), 8); eocd.set(u16(central.length), 10);
  eocd.set(u32(cdSize), 12); eocd.set(u32(offset), 16);
  const out = new Uint8Array(offset + cdSize + 22);
  let p = 0;
  parts.forEach(b => { out.set(b, p); p += b.length; });
  central.forEach(c => { out.set(c.hdr, p); out.set(c.nameB, p + c.hdr.length); p += c.hdr.length + c.nameB.length; });
  out.set(eocd, p);
  return out;
}

function buildWorkbookXlsx(sheets) {
  // sheets: [{name, rows}]
  const ct = [`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>`];
  const wbSheets = [], wbRels = [], files = [];
  sheets.forEach((s, i) => {
    const n = i + 1;
    ct.push(`<Override PartName="/xl/worksheets/sheet${n}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`);
    wbSheets.push(`<sheet name="${_xmlEsc(s.name.slice(0, 31))}" sheetId="${n}" r:id="rId${n}"/>`);
    wbRels.push(`<Relationship Id="rId${n}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${n}.xml"/>`);
    files.push({ name: `xl/worksheets/sheet${n}.xml`, data: _sheetXml(s.rows) });
  });
  ct.push(`</Types>`);
  wbRels.push(`<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>`);
  files.unshift(
    { name: '[Content_Types].xml', data: ct.join('') },
    { name: '_rels/.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
    { name: 'xl/workbook.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${wbSheets.join('')}</sheets></workbook>` },
    { name: 'xl/_rels/workbook.xml.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${wbRels.join('')}</Relationships>` },
    { name: 'xl/styles.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="1"><font><sz val="11"/><name val="Calibri"/></font></fonts><fills count="1"><fill><patternFill patternType="none"/></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="1"><xf/></cellXfs></styleSheet>` }
  );
  return _zipStore(files);
}

function exportAnalyticsXlsx() {
  try {

    const isM = ui.analyticsPeriod !== 'all';
