      if (!isM) return true;
      const d = parseYmd(e.date);
      return d.getFullYear() === ui.year && d.getMonth() === ui.month;
    }).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
    const evIds = new Set(evs.map(e => e.id));
    const evById = new Map(db.events.map(e => [e.id, e]));
    const periodLabel = isM ? `${MONTHS[ui.month]} ${ui.year}` : 'Всё время';

    // События
    const evRows = [['Дата', 'Время', 'Событие', 'Тип', 'Цена билета', 'Мест', 'Записано чел.', 'Пришло чел.', 'Собрано, ₽']];
    let totalRev = 0;
    evs.forEach(e => {
      const { booked, checked, paidSum } = getEventStats(e.id, e.price || 0);
      const rev = paidSum + (e.presenceType === 'rent' && e.isPaid ? (Number(e.price) || 0) : 0);
      totalRev += rev;
      evRows.push([
        e.date, e.time, e.title || '',
        PRESENCE[e.presenceType]?.label || e.presenceType || '',
        Number(e.price) || 0,
        e.presenceType === 'trip' ? '' : (Number(e.capacity) || 0),
        e.presenceType === 'trip' ? '' : booked,
        e.presenceType === 'trip' ? '' : checked,
        rev
      ]);
    });

    // Гости и оплаты
    const bkRows = [['Дата события', 'Событие', 'Гость', 'Telegram', 'Мест', 'Статус оплаты', 'Сумма, ₽', 'Пришёл', 'Заметка']];
    let paidBookings = 0;
    db.bookings.filter(b => evIds.has(b.eventId) && !b.isWaitlist)
      .sort((a, b) => (a.eventDate || '').localeCompare(b.eventDate || '') || (a.guestName || '').localeCompare(b.guestName || '', 'ru'))
      .forEach(b => {
        const ev = evById.get(b.eventId) || {};
        const status = normalizePaymentStatus(b.paymentStatus, b.isPaid);
        const amt = getBookingCollected(b, ev);
        if (status === 'paid') { paidBookings++; }
        bkRows.push([
          b.eventDate || ev.date || '', ev.title || b.eventTitle || '', b.guestName || '', b.telegram || '',
          Math.max(1, Number(b.ticketsCount) || 1),
          STATUS_LABEL_RU[status] || status,
          status === 'paid' ? amt : 0,
          b.isCheckedIn ? 'да' : '',
          b.note || ''
        ]);
      });

    // Клиенты
    const clRows = [['Гость', 'Telegram', 'Визитов', 'Оплачено всего, ₽', 'Крайний визит', 'Заметки']];
    buildClientList().sort((a, b) => b.total - a.total).forEach(c => {
      clRows.push([c.name || '', c.telegram || '', c.visits, c.total, c.lastSeen ? fmtDateRu(c.lastSeen) : '', c.notes || '']);
    });

    // Сводка
    const nowStr = new Date().toLocaleString('ru-RU');
    const sumRows = [
      ['Пятница.Пульт — экспорт данных'],
      ['Период', periodLabel],
      ['Сформировано', nowStr],
      [],
      ['Событий в периоде', evs.length],
      ['Записей гостей (броней)', bkRows.length - 1],
      ['Оплаченных броней', paidBookings],
      ['Собрано, ₽', Math.round(totalRev)],
      ['Гостей в базе', db.clients.length],
      ['Событий в архиве (старше 90 дней)', db.events.filter(e => e.isArchived).length]
    ];

    const bytes = buildWorkbookXlsx([
      { name: 'Сводка', rows: sumRows },
      { name: 'События', rows: evRows },
      { name: 'Гости и оплаты', rows: bkRows },
      { name: 'Клиенты', rows: clRows }
    ]);
    const blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `pyatnitsa_${isM ? `${ui.year}-${String(ui.month + 1).padStart(2, '0')}` : 'all'}_${getTodayISO()}.xlsx`;
    a.click(); URL.revokeObjectURL(a.href);
    toast(`Excel сохранён: ${evs.length} соб., ${bkRows.length - 1} броней`);
  } catch (err) {
    console.error('exportAnalyticsXlsx:', err);
    toast('Не удалось сформировать Excel');
  }
}

// ============================================================================
// АРХИВАЦИЯ: события старше ARCHIVE_AFTER_DAYS дней помечаются isArchived.
// Архив остаётся в базе и в аналитике, но помечается в списках («Все / Архив»),
// а надгробия deletedIds старше месяца удаляются — база не пухнет.
// ============================================================================
const ARCHIVE_AFTER_DAYS = 90;
const DELETED_TOMBSTONE_DAYS = 30;

function runArchiveSweep(d) {
  if (!d || !Array.isArray(d.events)) return 0;
  const border = ymd(new Date(Date.now() - ARCHIVE_AFTER_DAYS * 86400000));
  let changed = 0;
  d.events.forEach(e => {
    if (e && e.date && e.date < border && !e.isArchived) {
      e.isArchived = true;
      e.archivedAt = nowTs();
      changed++;
    }
  });
  return changed;
}

function pruneDeletedIds(d) {
  if (!d || !d.deletedIds) return 0;
  const border = Date.now() - DELETED_TOMBSTONE_DAYS * 86400000;
  let removed = 0;
  Object.keys(d.deletedIds).forEach(id => {
    const t = Number(d.deletedIds[id]) || 0;
    if (t && t < border) { delete d.deletedIds[id]; removed++; }
  });
  return removed;
}

function compactDatabaseAction() {
  const removed = pruneDeletedIds(db);
  if (removed > 0) { logAct('compact', `Удалено меток удалений: ${removed}`); saveDatabase(true); }
  toast(removed > 0 ? `База сжата: удалено меток удаления — ${removed}` : 'Чистить нечего — база уже компактна');
  render();
}

// ============================================================================
// TELEGRAM-ПОСТ v2: группировка по дням, эмодзи типов, свободные места
// ============================================================================
const TG_EMOJI = { must: '🎙', team: '🧩', rent: '🔑' };

function generateTgText() {
  const o = ui.tgPostOpts;
  const evs = db.events.filter(e => {
    const d = parseYmd(e.date);
    return d.getFullYear() === ui.year && d.getMonth() === ui.month && e.presenceType !== 'trip';
  }).sort((a, b) => new Date(`${a.date}T${a.time}`) - new Date(`${b.date}T${b.time}`));

  let text = `🕯 РАСПИСАНИЕ НА ${MONTHS[ui.month].toUpperCase()}\nПространство «Пятница»\n`;
  let lastDate = '';
  evs.forEach(e => {
    const d = parseYmd(e.date);
    const dow = DOW[(d.getDay() + 6) % 7];
    const fmt = db.formats.find(f => f.id === e.formatId);
    const desc = fmt?.shortDescription || e.note;
    if (e.date !== lastDate) {
      text += `\n———

📅 ${d.getDate()} ${MONTHS_GEN[d.getMonth()]}, ${dow.toLowerCase()}\n`;
      lastDate = e.date;
    }
    const emoji = TG_EMOJI[e.presenceType] || '🎟';
    text += `${emoji} ${e.time} — ${e.title}\n`;
    if (o.includeDescriptions && desc) text += `   ${desc}\n`;
    if (o.includePrices) text += `   💰 ${e.price ? e.price + ' ₽' : 'вход свободный'}\n`;
    if (o.includeSeats && e.presenceType !== 'rent' && e.capacity > 0) {
      const { booked } = getEventStats(e.id);
      const left = Math.max(0, e.capacity - booked);
      text += left > 0
        ? `   🪑 Свободно мест: ${left} из ${e.capacity}\n`
        : `   🔥 Мест не осталось — запись в резерв\n`;
    }
  });
  if (!evs.length) text += `\nАфиша формируется — следите за обновлениями\n`;
  if (o.includeAddress) {
    text += `\n—————————\n📍 ул. Тургенева, 14/1\n💌 Запись: @lena_timinova`;
  }
  return text.trim();
}

// Восстановление автоматической копии (создаётся перед импортом/сбоем загрузки)
function restoreAutoBackup() {
  const raw = localStorage.getItem(STORE_BACKUP_KEY);
  if (!raw) { toast('Авто-копия не найдена'); return; }
  let parsed = null;
  try { parsed = JSON.parse(raw); } catch(e) { toast('Авто-копия повреждена'); return; }
  const when = parsed && parsed.updatedAt ? new Date(Number(parsed.updatedAt)).toLocaleString('ru-RU') : 'неизвестно';
  confirmAction('Восстановить авто-копию?', `Текущие данные будут заменены копией от ${when}.\n\nСначала будет скачан бэкап текущего состояния — на всякий случай.`, 'Восстановить', () => {
    try { exportBackup(); } catch(e) {}
    try {
      db = normalizeAndMigrateDB(parsed);
      db = cleanupClientDuplicates(db);
      logAct('restore_backup');
      saveDatabase(false);
      forceCloseModal();
      render();
      toast('Авто-копия восстановлена');
    } catch(e) {
      console.error('restoreAutoBackup:', e);
      toast('Ошибка восстановления');
    }
  });
}

function importBackup(e) {
  const file = e.target.files?.[0]; if(!file) return;
  const r = new FileReader(); r.onload = () => {
    let parsed = null;
    try { parsed = JSON.parse(r.result); } catch(err) { toast('Файл не является корректным JSON'); return; }
    if (!parsed || (!Array.isArray(parsed.events) && !Array.isArray(parsed.clients) && !Array.isArray(parsed.bookings))) {
      toast('В файле нет данных приложения (события/гости/брони)'); return;
    }
    const counts = `события: ${Array.isArray(parsed.events) ? parsed.events.length : 0} · брони: ${Array.isArray(parsed.bookings) ? parsed.bookings.length : 0} · гости: ${Array.isArray(parsed.clients) ? parsed.clients.length : 0}`;
    confirmAction('Заменить базу из файла?', `Файл: ${file.name}\nВ нём: ${counts}.\n\nТекущие данные будут заменены. Сначала автоматически скачается бэкап текущего состояния.`, 'Заменить', () => {
      try { exportBackup(); } catch(err) {}
      try {
        db = cleanupClientDuplicates(normalizeAndMigrateDB(parsed));
        runArchiveSweep(db);
        logAct('import', `${file.name || 'бэкап'} (${counts})`);
        saveDatabase(true);
        forceCloseModal();
        render();
        toast('Данные успешно восстановлены из файла');
      } catch(err){
        console.error('importBackup:', err);
        toast('Ошибка чтения файла бэкапа');
      }
    });
  };
  r.readAsText(file);
}

// ============================================================================
// PWA-lite: манифест и тема инжектятся на лету (работает даже без manifest.json),
// service worker регистрируется, если рядом лежит sw.js (файл из поставки).
// ============================================================================
(function setupPwaLite() {
  try {
    const iconSvg = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#232323"/><stop offset="1" stop-color="#4A4A4A"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="url(#g)"/><circle cx="256" cy="256" r="132" fill="none" stroke="#FFFFFF" stroke-width="28"/><circle cx="256" cy="256" r="34" fill="#FFFFFF"/></svg>');
    const manifest = {
      name: 'Пятница.Пульт — управление пространством',
      short_name: 'Пятница.Пульт',
      description: 'Расписание, гости и оплаты пространства',
      start_url: '.', scope: '.', display: 'standalone', orientation: 'portrait',
      background_color: '#F4F4F2', theme_color: '#1C1C1C',
      icons: [{ src: iconSvg, sizes: 'any', type: 'image/svg+xml', purpose: 'any' }]
    };
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
    document.head.appendChild(link);
    const meta = document.createElement('meta');
    meta.name = 'theme-color';
    meta.content = '#1C1C1C';
    document.head.appendChild(meta);
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  } catch(e) { console.warn('PWA-lite:', e); }
})();

  }, 1500);

  });

  window.addEventListener('online', handleAppResume);
  // Дата «сегодня» обновляется сама — планшет на входе живёт сутками без перезагрузки
  let __lastToday = getTodayISO();

      console.error('Ошибка pageshow:', err);
    }
  });

    if (FormGuard.isDirty()) {
      e.preventDefault();
      e.returnValue = '';
      return '';
    }
    saveDatabase(false);
  });
})();
